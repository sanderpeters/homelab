apiVersion: apps/v1
kind: Deployment
metadata:
  name: journiv
  namespace: journiv
  labels:
    app: journiv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: journiv
  template:
    metadata:
      labels:
        app: journiv
    spec:
      containers:
        - name: journiv
          image: swalabtech/journiv-app:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DOMAIN_NAME
              value: "journal.sanderpeters.cloud"
            - name: DOMAIN_SCHEME
              value: "https"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: journiv-secret-key
                  key: secret-key
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: journiv-data
