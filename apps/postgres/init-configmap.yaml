apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: postgres
data:
  init.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE DATABASE keycloak;
      CREATE USER keycloak_user WITH PASSWORD '$KEYCLOAK_DB_PASSWORD';
      GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak_user;
      ALTER DATABASE keycloak OWNER TO keycloak_user;

      CREATE DATABASE journiv;
      CREATE USER journiv_user WITH PASSWORD '$JOURNIV_DB_PASSWORD';
      GRANT ALL PRIVILEGES ON DATABASE journiv TO journiv_user;
      ALTER DATABASE journiv OWNER TO journiv_user;
    EOSQL
