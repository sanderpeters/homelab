apiVersion: apps/v1
kind: Deployment
metadata:
  name: journiv
  namespace: journiv
  labels:
    app: journiv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: journiv
  template:
    metadata:
      labels:
        app: journiv
    spec:
      containers:
        - name: journiv
          image: swalabtech/journiv-app:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DOMAIN_NAME
              value: "journal.sanderpeters.cloud"
            - name: DOMAIN_SCHEME
              value: "https"
            - name: DB_DRIVER
              value: "postgres"
            - name: POSTGRES_HOST
              value: "postgres.postgres.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "journiv"
            - name: POSTGRES_USER
              value: "journiv_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: journiv-db-credentials
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: journiv-secret-key
                  key: secret-key
            - name: REDIS_URL
              value: "redis://journiv-valkey:6379/0"
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER
              value: "https://login.sanderpeters.cloud/realms/homelab"
            - name: OIDC_CLIENT_ID
              value: "journiv"
            - name: OIDC_REDIRECT_URI
              value: "https://journal.sanderpeters.cloud/api/v1/auth/oidc/callback"
            - name: OIDC_AUTO_PROVISION
              value: "true"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: journiv-oidc-credentials
                  key: client-secret
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: journiv-data
